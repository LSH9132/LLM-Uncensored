services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ${TS_HOSTNAME:-llm-uncensored}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  koboldcpp:
    image: koboldai/koboldcpp:${KOBOLD_VERSION:-latest}
    container_name: koboldcpp
    restart: unless-stopped
    network_mode: service:tailscale
    volumes:
      - ./models:/models
    environment:
      - KOBOLD_CONTEXT_SIZE=${KOBOLD_CONTEXT_SIZE:-4096}
      - KOBOLD_THREADS=${KOBOLD_THREADS:-8}
      - KOBOLD_GPU_LAYERS=${KOBOLD_GPU_LAYERS:--1}
      - KOBOLD_TENSOR_SPLIT=${KOBOLD_TENSOR_SPLIT}
      - KOBOLD_BLAS_BATCH_SIZE=${KOBOLD_BLAS_BATCH_SIZE:-512}
      - KCPP_ARGS=--model /models/${MODEL_FILENAME} --contextsize ${KOBOLD_CONTEXT_SIZE:-4096} --gpulayers ${KOBOLD_GPU_LAYERS:--1} --threads ${KOBOLD_THREADS:-8} --blasbatchsize ${KOBOLD_BLAS_BATCH_SIZE:-512} --usecublas lowvram --port 5001 --host 0.0.0.0 --smartcontext
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  sillytavern:
    image: ghcr.io/sillytavern/sillytavern:${SILLYTAVERN_VERSION:-latest}
    container_name: sillytavern
    restart: unless-stopped
    network_mode: service:tailscale
    volumes:
      - ./data/sillytavern/config:/home/node/app/config
      - ./data/sillytavern/data:/home/node/app/data
      - ./data/sillytavern/plugins:/home/node/app/plugins
      - ./data/sillytavern/public/user:/home/node/app/public/user
      - ./data/sillytavern/public/assets:/home/node/app/public/assets
      - ./data/sillytavern/public/backgrounds:/home/node/app/public/backgrounds
